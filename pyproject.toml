[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doughflow"
version = "0.1.0"
description = "Sales forecasting for bakery operations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Andy Dinh", email = "andydinh2703@gmail.com"}
]

dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "streamlit"
]

[tool.setuptools.packages.find]
where = ["src"]